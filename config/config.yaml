server:
  port: 9200
  read_timeout: 30s
  write_timeout: 30s

# 业务数据库（渠道 / 模型查询）
database:
  driver: "mysql"                   # mysql 或 postgres
  dsn: "root:123456@tcp(192.168.58.129:3306)/new-api?parseTime=true"
  max_open_conns: 10
  max_idle_conns: 5

# 告警平台数据库（告警规则存储 + 日志查询）
log_database:
  driver: "postgres"
  dsn: "postgresql://root:postgres@192.168.58.129:5432/new_api?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5

engine:
  poll_interval: 30s
  rule_reload_interval: 60s
  default_window_sec: 300
  default_cooldown_sec: 600
  checkpoint_file: "data/checkpoint.json"

logging:
  level: "info"
  format: "json"

auth:
  jwt_secret: "tt-inspector-jwt-secret-change-me"   # 生产环境请更换
  admin_password: "AIGateway@2026!Admin"              # 生产环境请更换

# 中转站检测（veridrop）：控制台通过 /veridrop 反向代理到独立部署的 veridrop 服务
# 被代理的 veridrop 启动时需要设置 VERIDROP_PREFIX=/veridrop，页面链接才会带前缀
veridrop:
  enabled: true
  upstream: "http://127.0.0.1:8000"

# 渠道探测：可用性探测 + 质量探测（veridrop 真伪检测）
# 这里只是首次启动/重置时的默认值，实际参数在控制台「渠道探测」页面调整并落库
probe:
  avail_default_cron: "0 */6 * * *"
  quality_default_cron: "0 4 * * *"
  timeout_sec: 15                # 可用性探测单请求超时（秒）
  concurrency: 5                 # 可用性探测并发数
  quality_timeout_sec: 300       # 质量探测单任务最长等待（秒）
  quality_score_threshold: 60    # 质量探测分数告警阈值
  cooldown_sec: 1800             # 告警冷却（秒）
